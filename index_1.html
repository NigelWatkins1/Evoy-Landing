body{
  margin:0;
  background:var(--page);
  color:var(--ink);
  font-family:var(--font-brand);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.stage{
  min-height:100%;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(30px,5vh,48px);
  padding-block:72px;
  padding-left:24px;
  padding-right:24px;
  text-align:center;
}

/* ---- the claim ---- */
.headline{
  --atv-h:clamp(34px,5.2vw,62px);
  margin:0;
  max-width:100%;
  /* Cap height of the fallback sans is ~.72em, so .98 * --atv-h puts the words at the
     same letterform height as the two marks (ATV letterforms = .70673 * --atv-h). */
  font-size:calc(var(--atv-h) * .98);
  font-weight:500;
  line-height:1.5;
  letter-spacing:-.02em;
  color:var(--ink);
  text-wrap:balance;
}
.evoy{
  -webkit-mask-image:var(--evoy-art); mask-image:var(--evoy-art);
  -webkit-mask-repeat:no-repeat;      mask-repeat:no-repeat;
  -webkit-mask-size:contain;          mask-size:contain;
  -webkit-mask-position:center;       mask-position:center;
  aspect-ratio:760/229;
  max-width:100%;
}
.headline .evoy{
  display:inline-block;
  height:calc(var(--atv-h) * .87137);
  width:calc(var(--atv-h) * .87137 * 760 / 229);
  background:var(--ink);
  vertical-align:calc(var(--atv-h) * -.16463);
  margin-right:calc(var(--atv-h) * .17);
}
.headline .atv{
  display:inline-block;
  height:var(--atv-h);
  width:auto;
  max-width:100%;
  vertical-align:calc(var(--atv-h) * -.29327);
  margin-left:calc(var(--atv-h) * .17);
}

/* ---- call to action ---- */
.cta-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.cta{
  display:inline-flex;
  align-items:center;
  gap:.6em;
  padding:15px 30px;
  border-radius:99px;
  background:var(--volt);
  color:#fff;
  font-size:clamp(.92rem,1.6vw,1rem);
  font-weight:600;
  letter-spacing:.01em;
  text-decoration:none;
  transition:background-color .22s ease, transform .22s ease;
}
.cta:hover{background:var(--volt-2);transform:translateY(-1px)}
.cta:focus-visible{outline:2px solid var(--volt);outline-offset:4px}
.cta svg{width:1em;height:1em;flex:none}
.dest{
  margin:0;
  font-size:.72rem;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--mist-2);
}

/* ---- opening frame ---- */
.veil{
  position:fixed;
  inset:0;
  z-index:5;
  background:var(--night);
  display:grid;
  place-items:center;
  animation:veil-out 1.05s cubic-bezier(.4,0,.2,1) .85s forwards;
}
.veil .evoy{
  width:clamp(170px,44vw,340px);
  height:auto;
  background:#fff;
  animation:mark-out .9s cubic-bezier(.4,0,.2,1) .78s forwards;
}
@keyframes veil-out{to{opacity:0;visibility:hidden}}
@keyframes mark-out{to{opacity:0;transform:translateY(-16px) scale(.94)}}

.headline,.cta-wrap{opacity:0;animation:rise .85s cubic-bezier(.2,.7,.2,1) forwards}
.headline{animation-delay:1.14s}
.cta-wrap{animation-delay:1.32s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion: reduce){
  .veil{display:none}
  .veil .evoy{animation:none}
  .headline,.cta-wrap{opacity:1;animation:none;transform:none}
  .cta{transition:none}
  .cta:hover{transform:none}
}
</style>
</head>
